name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (App is a Linux-safe shim; full XAML compile on windows)
        run: dotnet build DeltaStudio.sln -c Release
      - name: Test
        run: dotnet test DeltaStudio.sln -c Release --nologo
